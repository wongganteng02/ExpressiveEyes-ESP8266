<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0.5" y="0.5" width="959" height="699" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">NEXABOT · Expressive Robot Eyes — Wiring Diagram</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#57606a">Wemos D1 Mini (ESP8266) · OLED SSD1306 I2C · DS1302 RTC · 2× passive buzzer · 1× push button</text>

  <!-- ===== WEMOS D1 MINI ===== -->
  <rect x="380" y="90" width="160" height="500" rx="10" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
  <rect x="425" y="590" width="70" height="26" rx="3" fill="#9ca3af" stroke="#4b5563"/>
  <text x="460" y="607" text-anchor="middle" font-size="11" fill="#111827">USB</text>
  <rect x="425" y="104" width="70" height="52" rx="4" fill="#0f172a"/>
  <text x="460" y="127" text-anchor="middle" font-size="11" fill="#e5e7eb">ESP8266</text>
  <text x="460" y="143" text-anchor="middle" font-size="11" fill="#e5e7eb">ESP-12</text>
  <text x="460" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">WEMOS</text>
  <text x="460" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">D1 MINI</text>

  <!-- left pins -->
  <g font-size="13" fill="#ffffff" font-weight="600">
    <text x="392" y="175">RST</text>
    <text x="392" y="225">A0</text>
    <text x="392" y="275">D0</text>
    <text x="392" y="325">D5</text>
    <text x="392" y="375">D6</text>
    <text x="392" y="425">D7</text>
    <text x="392" y="475">D8</text>
    <text x="392" y="525">3V3</text>
  </g>
  <!-- right pins -->
  <g font-size="13" fill="#ffffff" font-weight="600" text-anchor="end">
    <text x="528" y="175">TX</text>
    <text x="528" y="225">RX</text>
    <text x="528" y="275">D1</text>
    <text x="528" y="325">D2</text>
    <text x="528" y="375">D3</text>
    <text x="528" y="425">D4</text>
    <text x="528" y="475">G</text>
    <text x="528" y="525">5V</text>
  </g>
  <g fill="#fbbf24" stroke="#92400e">
    <circle cx="380" cy="170" r="5"/><circle cx="380" cy="220" r="5"/><circle cx="380" cy="270" r="5"/><circle cx="380" cy="320" r="5"/>
    <circle cx="380" cy="370" r="5"/><circle cx="380" cy="420" r="5"/><circle cx="380" cy="470" r="5"/><circle cx="380" cy="520" r="5"/>
    <circle cx="540" cy="170" r="5"/><circle cx="540" cy="220" r="5"/><circle cx="540" cy="270" r="5"/><circle cx="540" cy="320" r="5"/>
    <circle cx="540" cy="370" r="5"/><circle cx="540" cy="420" r="5"/><circle cx="540" cy="470" r="5"/><circle cx="540" cy="520" r="5"/>
  </g>

  <!-- ===== OLED ===== -->
  <rect x="720" y="190" width="190" height="140" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="830" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">OLED 0.96" SSD1306</text>
  <text x="830" y="230" text-anchor="middle" font-size="11" fill="#4b5563">128×64 · I2C · addr 0x3C</text>
  <rect x="790" y="244" width="100" height="62" rx="3" fill="#111827"/>
  
  <g font-size="12" fill="#111827" font-weight="600">
    <text x="728" y="219">GND</text>
    <text x="728" y="249">VCC</text>
    <text x="728" y="279">SCL</text>
    <text x="728" y="309">SDA</text>
  </g>
  <g fill="#fbbf24" stroke="#92400e">
    <circle cx="720" cy="215" r="4"/><circle cx="720" cy="245" r="4"/><circle cx="720" cy="275" r="4"/><circle cx="720" cy="305" r="4"/>
  </g>

  <!-- ===== DS1302 ===== -->
  <rect x="720" y="380" width="190" height="170" rx="8" fill="#ecfdf5" stroke="#065f46" stroke-width="2"/>
  <text x="830" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">DS1302 RTC</text>
  <text x="830" y="420" text-anchor="middle" font-size="11" fill="#047857">+ baterai CR2032</text>
  <circle cx="850" cy="480" r="26" fill="#d1d5db" stroke="#6b7280"/>
  <text x="850" y="484" text-anchor="middle" font-size="10" fill="#374151">CR2032</text>
  <g font-size="12" fill="#064e3b" font-weight="600">
    <text x="728" y="404">VCC</text>
    <text x="728" y="434">GND</text>
    <text x="728" y="464">CLK</text>
    <text x="728" y="494">DAT</text>
    <text x="728" y="524">RST</text>
  </g>
  <g fill="#fbbf24" stroke="#92400e">
    <circle cx="720" cy="400" r="4"/><circle cx="720" cy="430" r="4"/><circle cx="720" cy="460" r="4"/><circle cx="720" cy="490" r="4"/><circle cx="720" cy="520" r="4"/>
  </g>

  <!-- ===== BUZZER 1 / BUTTON / BUZZER 2 (kiri) ===== -->
  <g>
    <rect x="70" y="298" width="160" height="44" rx="8" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
    <text x="150" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Buzzer 1 (passive)</text>
    <text x="150" y="333" text-anchor="middle" font-size="11" fill="#9a3412">pin (+) → D5</text>

    <rect x="70" y="348" width="160" height="44" rx="8" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
    <text x="150" y="367" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Push Button</text>
    <text x="150" y="383" text-anchor="middle" font-size="11" fill="#1e40af">kaki 1 → D6 · kaki 2 → GND</text>

    <rect x="70" y="398" width="160" height="44" rx="8" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
    <text x="150" y="417" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Buzzer 2 (passive)</text>
    <text x="150" y="433" text-anchor="middle" font-size="11" fill="#9a3412">pin (+) → D7</text>
  </g>

  <!-- ===== SIGNAL WIRES ===== -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- I2C -->
    <polyline stroke="#d97706" points="540,270 600,270 600,275 720,275"/>
    <polyline stroke="#2563eb" points="540,320 620,320 620,305 720,305"/>
    <!-- DS1302 -->
    <polyline stroke="#16a34a" points="540,370 650,370 650,460 720,460"/>
    <polyline stroke="#9333ea" points="540,420 620,420 620,490 720,490"/>
    <polyline stroke="#db2777" points="380,470 300,470 300,640 680,640 680,520 720,520"/>
    <!-- buzzers + button -->
    <polyline stroke="#ea580c" points="380,320 230,320"/>
    <polyline stroke="#0891b2" points="380,370 230,370"/>
    <polyline stroke="#ea580c" points="380,420 230,420"/>
  </g>

  <!-- ===== POWER STUBS ===== -->
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <!-- 3V3 dari Wemos -->
    <line x1="380" y1="520" x2="345" y2="520" stroke="#dc2626"/>
    <!-- GND dari Wemos -->
    <line x1="540" y1="470" x2="600" y2="470" stroke="#111827"/>
    <!-- OLED -->
    <line x1="720" y1="215" x2="690" y2="215" stroke="#111827"/>
    <line x1="720" y1="245" x2="690" y2="245" stroke="#dc2626"/>
    <!-- DS1302 -->
    <line x1="720" y1="400" x2="690" y2="400" stroke="#dc2626"/>
    <line x1="720" y1="430" x2="690" y2="430" stroke="#111827"/>
    <!-- buzzer/button GND -->
    <line x1="70" y1="320" x2="40" y2="320" stroke="#111827"/>
    <line x1="70" y1="370" x2="40" y2="370" stroke="#111827"/>
    <line x1="70" y1="420" x2="40" y2="420" stroke="#111827"/>
  </g>
  <g font-size="12" font-weight="700">
    <text x="343" y="514" text-anchor="end" fill="#dc2626">3V3</text>
    <text x="548" y="488" fill="#111827">GND</text>
    <text x="686" y="219" text-anchor="end" fill="#111827">GND</text>
    <text x="686" y="249" text-anchor="end" fill="#dc2626">3V3</text>
    <text x="686" y="404" text-anchor="end" fill="#dc2626">3V3</text>
    <text x="686" y="434" text-anchor="end" fill="#111827">GND</text>
    <text x="36" y="324" text-anchor="end" fill="#111827">GND</text>
    <text x="36" y="374" text-anchor="end" fill="#111827">GND</text>
    <text x="36" y="424" text-anchor="end" fill="#111827">GND</text>
  </g>
  <text x="546" y="542" font-size="11" fill="#6b7280">5V: tidak dipakai</text>

  <!-- ===== PIN LABELS ON WIRES ===== -->
  <g font-size="11" font-weight="700">
    <text x="262" y="314" fill="#ea580c">D5</text>
    <text x="262" y="364" fill="#0891b2">D6</text>
    <text x="262" y="414" fill="#ea580c">D7</text>
    <text x="306" y="464" fill="#db2777">D8 → RST</text>
    <text x="560" y="264" fill="#d97706">D1 → SCL</text>
    <text x="560" y="314" fill="#2563eb">D2 → SDA</text>
    <text x="560" y="364" fill="#16a34a">D3 → CLK</text>
    <text x="560" y="414" fill="#9333ea">D4 → DAT</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <rect x="40" y="480" width="250" height="118" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="54" y="500" font-size="12" font-weight="700" fill="#1f2328">Catatan</text>
  <g font-size="11" fill="#57606a">
    <text x="54" y="518">• Semua VCC ke 3V3 (bukan 5V).</text>
    <text x="54" y="535">• Buzzer harus passive (pakai tone()).</text>
    <text x="54" y="552">• Tombol: INPUT_PULLUP, aktif LOW.</text>
    <text x="54" y="569">• Semua GND disatukan (common).</text>
    <text x="54" y="586">• Kabel merah = 3V3, hitam = GND.</text>
  </g>

  <text x="480" y="684" text-anchor="middle" font-size="11" fill="#6b7280">Pin sesuai firmware ExpressiveEyes.ino · I2C: Wire.begin(D2, D1)</text>
</svg>
